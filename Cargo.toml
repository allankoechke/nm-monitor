[workspace]
resolver = "2"
members = [
    "crates/nm-core",
    "crates/nm-store",
    "crates/nm-discovery",
    "crates/nm-classify",
    "crates/nm-notify",
    "crates/nm-speedtest",
    "crates/nm-api",
    "crates/nm-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Network Monitor Contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
mac_address = { version = "1", features = ["serde"] }
ipnetwork = "0.21"
pnet = "0.35"
surge-ping = "0.8"
pcap = "2"
mdns-sd = "0.13"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
refinery = { version = "0.8", features = ["rusqlite"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
notify-rust = "4"
rtnetlink = "0.17"
netlink-packet-route = "0.22"
futures = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
hostname = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dashmap = "6"
parking_lot = "0.12"
tokio-stream = "0.1"
bytes = "1"
etherparse = "0.17"

[agent]
name = "Fedora WStation"

[network]
interface = "auto"
scan_interval_secs = 60
passive_capture = true
gateway = "auto"
presence_timeout_secs = 180
link_check_interval_secs = 30

[speedtest]
enabled = true
interval_secs = 21600
backend = "cloudflare"
min_interval_secs = 300

[storage]
database_path = "~/.local/share/network-monitor/network-monitor.db"

[api]
bind_addr = "127.0.0.1:8080"
enabled = true

[notifications.ntfy]
enabled = true
server = "https://ntfy.sh"
topic = "home-lan"

[notifications.webhook]
enabled = false
url = "https://example.com/hooks/network"
secret = "env:WEBHOOK_SECRET"

[notifications.desktop]
enabled = true

[notifications.fcm]
enabled = false
